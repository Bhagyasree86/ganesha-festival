<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Manage Events | Sri Durgamamba Youth
    </title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================
           BODY
        ===================================== */

        body {

            min-height: 100vh;

            font-family:
                "Poppins",
                sans-serif;

            color: #f5f1e8;

            background:

                linear-gradient(
                    rgba(18, 9, 9, 0.92),
                    rgba(18, 9, 9, 0.97)
                ),

                url("images/vinayaka.jpg")
                center / cover fixed no-repeat;

        }


        /* =====================================
           NAVBAR
        ===================================== */

        nav {

            width: 100%;

            padding:
                18px 5%;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            background:
                rgba(
                    12,
                    6,
                    6,
                    0.96
                );

            border-bottom:
                1px solid #6f5720;

        }


        .logo {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                23px;

            font-weight:
                700;

            letter-spacing:
                1px;

            color:
                #d4af37;

        }


        .nav-btn {

            text-decoration:
                none;

            color:
                #d4af37;

            border:
                1px solid #8b712b;

            padding:
                10px 20px;

            border-radius:
                7px;

            font-size:
                13px;

            transition:
                0.3s;

        }


        .nav-btn:hover {

            background:
                #d4af37;

            color:
                #15100a;

        }


        /* =====================================
           MAIN
        ===================================== */

        .container {

            width:
                90%;

            max-width:
                1100px;

            margin:
                55px auto;

        }


        /* =====================================
           HEADING
        ===================================== */

        .heading {

            text-align:
                center;

            margin-bottom:
                35px;

        }


        .heading h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                46px;

            color:
                #d4af37;

            letter-spacing:
                1px;

            margin-bottom:
                10px;

        }


        .heading p {

            color:
                #cfc6b6;

            font-size:
                14px;

        }


        /* =====================================
           ADD EVENT BUTTON
        ===================================== */

        .top-actions {

            display:
                flex;

            justify-content:
                center;

            margin-bottom:
                35px;

        }


        .add-btn {

            display:
                inline-block;

            text-decoration:
                none;

            padding:
                12px 25px;

            border:
                1px solid #8b712b;

            border-radius:
                7px;

            background:
                #d4af37;

            color:
                #15100a;

            font-size:
                14px;

            font-weight:
                600;

            transition:
                0.3s;

        }


        .add-btn:hover {

            background:
                #f0d878;

            transform:
                translateY(-2px);

        }


        /* =====================================
           EVENTS GRID
        ===================================== */

        #eventsContainer {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap:
                25px;

        }


        /* =====================================
           EVENT CARD
        ===================================== */

        .event-card {

            position:
                relative;

            padding:
                28px;

            background:
                rgba(
                    25,
                    12,
                    12,
                    0.96
                );

            border:
                1px solid #6f5720;

            border-radius:
                17px;

            box-shadow:
                0 15px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.40
                );

            transition:
                0.3s;

        }


        .event-card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                3px;

            background:
                #d4af37;

            border-radius:
                17px 17px 0 0;

        }


        .event-card:hover {

            transform:
                translateY(-6px);

            border-color:
                #d4af37;

            box-shadow:
                0 20px 45px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

        }


        /* =====================================
           EVENT YEAR
        ===================================== */

        .event-year {

            display:
                inline-block;

            padding:
                5px 12px;

            margin-bottom:
                13px;

            border:
                1px solid #6f5720;

            border-radius:
                20px;

            background:
                rgba(
                    212,
                    175,
                    55,
                    0.10
                );

            color:
                #d4af37;

            font-size:
                12px;

            font-weight:
                600;

        }


        /* =====================================
           EVENT TITLE
        ===================================== */

        .event-card h2 {

            font-family:
                "Playfair Display",
                serif;

            color:
                #d4af37;

            font-size:
                27px;

            margin-bottom:
                14px;

        }


        /* =====================================
           EVENT INFO
        ===================================== */

        .event-info {

            color:
                #cfc6b6;

            font-size:
                13px;

            line-height:
                1.9;

            margin-bottom:
                14px;

        }


        .event-info strong {

            color:
                #d4af37;

        }


        /* =====================================
           DESCRIPTION
        ===================================== */

        .description {

            color:
                #aaa294;

            font-size:
                13px;

            line-height:
                1.7;

            min-height:
                45px;

            margin-bottom:
                20px;

        }


        /* =====================================
           ACTION BUTTONS
        ===================================== */

        .actions {

            display:
                flex;

            gap:
                10px;

        }


        .edit-btn,
        .delete-btn {

            padding:
                9px 18px;

            border-radius:
                6px;

            font-family:
                "Poppins",
                sans-serif;

            font-size:
                12px;

            cursor:
                pointer;

            transition:
                0.3s;

        }


        /* EDIT */

        .edit-btn {

            border:
                1px solid #8b712b;

            background:
                #d4af37;

            color:
                #15100a;

        }


        .edit-btn:hover {

            background:
                #f0d878;

        }


        /* DELETE */

        .delete-btn {

            border:
                1px solid #71333b;

            background:
                #5a2028;

            color:
                #f5e9e9;

        }


        .delete-btn:hover {

            background:
                #7c2d38;

        }


        /* =====================================
           EMPTY
        ===================================== */

        .empty {

            grid-column:
                1 / -1;

            text-align:
                center;

            padding:
                50px 20px;

            background:
                rgba(
                    25,
                    12,
                    12,
                    0.95
                );

            border:
                1px solid #6f5720;

            border-radius:
                16px;

            color:
                #aaa294;

            font-size:
                14px;

            line-height:
                1.7;

        }


        /* =====================================
           BACK
        ===================================== */

        .back-section {

            text-align:
                center;

            margin-top:
                40px;

        }


        .back-btn {

            text-decoration:
                none;

            color:
                #d4af37;

            font-size:
                14px;

            transition:
                0.3s;

        }


        .back-btn:hover {

            color:
                #f0d878;

        }


        /* =====================================
           FOOTER
        ===================================== */

        footer {

            margin-top:
                70px;

            padding:
                35px 20px;

            text-align:
                center;

            background:
                #0d0606;

            border-top:
                1px solid #6f5720;

            color:
                #aaa294;

            font-size:
                13px;

            line-height:
                1.8;

        }


        .footer-title {

            font-family:
                "Playfair Display",
                serif;

            color:
                #d4af37;

            font-size:
                21px;

            letter-spacing:
                1px;

            margin-bottom:
                8px;

        }


        .footer-instagram {

            color:
                #d4af37;

        }


        .footer-address {

            margin-top:
                5px;

        }


        .copyright {

            color:
                #77736b;

            font-size:
                12px;

            margin-top:
                10px;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            nav {

                padding:
                    15px 5%;

            }


            .logo {

                font-size:
                    18px;

            }


            .nav-btn {

                padding:
                    8px 13px;

                font-size:
                    11px;

            }


            .container {

                width:
                    94%;

                margin:
                    40px auto;

            }


            .heading h1 {

                font-size:
                    35px;

            }


            #eventsContainer {

                grid-template-columns:
                    1fr;

            }


            .event-card {

                padding:
                    23px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================
     NAVBAR
===================================== -->

<nav>


    <div class="logo">

        Sri Durgamamba Youth

    </div>


    <a
        href="admin.html"
        class="nav-btn">

        Admin Dashboard

    </a>


</nav>



<!-- =====================================
     MAIN
===================================== -->

<div class="container">


    <!-- HEADING -->

    <div class="heading">

        <h1>
            Manage Events
        </h1>

        <p>
            View, edit and manage festival events
        </p>

    </div>



    <!-- =====================================
         ADD EVENT
    ===================================== -->

    <div class="top-actions">

        <a
            href="event-upload.html"
            class="add-btn">

            + Add New Event

        </a>

    </div>



    <!-- =====================================
         EVENTS
    ===================================== -->

    <div id="eventsContainer">

        <div class="empty">

            Loading events...

        </div>

    </div>



    <!-- =====================================
         BACK
    ===================================== -->

    <div class="back-section">

        <a
            href="admin.html"
            class="back-btn">

            ← Back to Admin Dashboard

        </a>

    </div>


</div>



<!-- =====================================
     FOOTER
===================================== -->

<footer>


    <div class="footer-title">

        SRI DURGAMAMBA YOUTH

    </div>


    <div class="footer-instagram">

        @durga_mamba_youth

    </div>


    <div class="footer-address">

        Durga Nagar, Saripalli, Pendurthi

    </div>


    <div class="copyright">

        © Sri Durgamamba Youth

    </div>


</footer>



<script>


// ======================================
// TOKEN
// ======================================

const token =
    localStorage.getItem(
        "token"
    );


// ======================================
// CHECK LOGIN
// ======================================

if (!token) {

    alert(
        "Please login first."
    );

    window.location.href =
        "login.html";

}


// ======================================
// EVENTS CONTAINER
// ======================================

const container =
    document.getElementById(
        "eventsContainer"
    );


// ======================================
// LOAD EVENTS
// ======================================

async function loadEvents() {

    try {

        const response =
            await fetch(
                "https://gnesha-festival-backend.onrender.com/api/events"
            );


        const events =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Unable to load events."
            );

        }


        container.innerHTML = "";


        if (
            events.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    No events have been added yet.

                    <br><br>

                    Click
                    "Add New Event"
                    to create your first event.

                </div>

            `;

            return;

        }


        events.forEach(
            event => {


                const eventDate =
                    new Date(
                        event.date
                    );


                const formattedDate =
                    eventDate.toLocaleDateString(
                        "en-IN",
                        {
                            day:
                                "2-digit",

                            month:
                                "long",

                            year:
                                "numeric"
                        }
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "event-card";


                card.innerHTML = `

                    <span class="event-year">

                        ${escapeHTML(
                            event.festivalYear
                        )}

                    </span>


                    <h2>

                        ${escapeHTML(
                            event.title
                        )}

                    </h2>


                    <div class="event-info">

                        <strong>
                            Date:
                        </strong>

                        ${formattedDate}

                        <br>

                        <strong>
                            Time:
                        </strong>

                        ${escapeHTML(
                            event.time
                        )}

                    </div>


                    <div class="description">

                        ${
                            event.description
                            ? escapeHTML(
                                event.description
                            )
                            : "No description provided."
                        }

                    </div>


                    <div class="actions">


                        <button
                            class="edit-btn"
                            onclick="
                                editEvent(
                                    '${event._id}'
                                )
                            ">

                            Edit

                        </button>


                        <button
                            class="delete-btn"
                            onclick="
                                deleteEvent(
                                    '${event._id}'
                                )
                            ">

                            Delete

                        </button>


                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    }

    catch (error) {

        console.log(
            error
        );


        container.innerHTML = `

            <div class="empty">

                Unable to connect to the server.

                <br><br>

                Please make sure the backend is running.

            </div>

        `;

    }

}


// ======================================
// EDIT EVENT
// ======================================

function editEvent(
    id
) {

    window.location.href =
        "event-upload.html?id=" +
        id;

}


// ======================================
// DELETE EVENT
// ======================================

async function deleteEvent(
    id
) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this event?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                "https://gnesha-festival-backend.onrender.com/api/events/" +
                id,
                {

                    method:
                        "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }
            );


        const data =
            await response.json();


        if (response.ok) {

            alert(
                "Event deleted successfully!"
            );


            loadEvents();

        }

        else {

            alert(
                data.message ||
                "Failed to delete event."
            );

        }

    }

    catch (error) {

        console.log(
            error
        );


        alert(
            "Unable to connect to the server."
        );

    }

}


// ======================================
// ESCAPE HTML
// ======================================

function escapeHTML(
    value
) {

    if (!value) {

        return "";

    }


    return String(
        value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ======================================
// START
// ======================================

loadEvents();

</script>


</body>

</html>
