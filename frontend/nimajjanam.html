<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nimajjanam | Sri Durgamamba Youth</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: "Poppins", sans-serif;

            color: #f5f1e8;

            background:
                linear-gradient(
                    rgba(18, 9, 9, 0.88),
                    rgba(18, 9, 9, 0.94)
                ),
                url("images/vinayaka.jpg")
                center / cover fixed no-repeat;
        }


        /* ============================= */
        /* NAVBAR */
        /* ============================= */

        nav {
            width: 100%;

            padding: 18px 5%;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 25px;

            background: rgba(12, 6, 6, 0.95);

            border-bottom: 1px solid #6f5720;
        }

        nav a {
            color: #d4af37;

            text-decoration: none;

            font-size: 14px;

            font-weight: 500;

            transition: 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }


        /* ============================= */
        /* HERO */
        /* ============================= */

        header {
            min-height: 330px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 70px 20px;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.55)
                ),
                url("images/vinayaka.jpg")
                center / cover no-repeat;

            border-bottom: 1px solid #6f5720;
        }

        header h1 {
            margin: 0;

            font-family:
                "Playfair Display",
                serif;

            font-size: 52px;

            letter-spacing: 3px;

            color: #d4af37;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.8);
        }

        header p {
            margin-top: 15px;

            font-size: 16px;

            color: #eee7d5;

            letter-spacing: 1px;
        }


        /* ============================= */
        /* CONTAINER */
        /* ============================= */

        .container {
            width: 90%;

            max-width: 1100px;

            margin: 55px auto;
        }


        /* ============================= */
        /* FILTER */
        /* ============================= */

        .filter-box {
            padding: 25px;

            margin-bottom: 35px;

            background:
                rgba(25, 13, 13, 0.90);

            border: 1px solid #6f5720;

            border-radius: 14px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.35);
        }

        .filter-box label {
            color: #d4af37;

            font-weight: 500;

            margin-right: 12px;
        }

        select {
            padding: 11px 15px;

            min-width: 150px;

            border-radius: 7px;

            border: 1px solid #8b712b;

            background: #160b0b;

            color: #f5f1e8;

            font-family:
                "Poppins",
                sans-serif;

            outline: none;
        }

        select:focus {
            border-color: #d4af37;
        }


        /* ============================= */
        /* RECORDS */
        /* ============================= */

        .records {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(320px, 1fr)
                );

            gap: 25px;
        }


        /* ============================= */
        /* RECORD CARD */
        /* ============================= */

        .record {
            position: relative;

            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(35, 18, 18, 0.96),
                    rgba(20, 10, 10, 0.96)
                );

            border: 1px solid #6f5720;

            border-radius: 16px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.40);

            transition: 0.3s;
        }

        .record:hover {
            transform: translateY(-5px);

            border-color: #d4af37;

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.55);
        }

        .record::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background: #d4af37;

            border-radius:
                16px 16px 0 0;
        }


        /* ============================= */
        /* PHOTO */
        /* ============================= */

        .nimajjanam-photo {
            width: 100%;

            max-height: 420px;

            object-fit: contain;

            display: block;

            margin: 0 auto 25px;

            border-radius: 10px;

            border: 1px solid #6f5720;

            background: #0d0606;
        }


        /* ============================= */
        /* YEAR */
        /* ============================= */

        .year {
            display: inline-block;

            padding: 6px 14px;

            border: 1px solid #8b712b;

            border-radius: 20px;

            color: #d4af37;

            background:
                rgba(212, 175, 55, 0.08);

            font-size: 13px;
        }


        /* ============================= */
        /* TITLE */
        /* ============================= */

        .record h2 {
            margin-top: 15px;

            margin-bottom: 25px;

            font-family:
                "Playfair Display",
                serif;

            color: #d4af37;

            font-size: 27px;
        }


        /* ============================= */
        /* DETAILS */
        /* ============================= */

        .detail {
            margin: 15px 0;

            line-height: 1.7;

            color: #ddd5c5;

            font-size: 14px;
        }

        .detail strong {
            color: #d4af37;

            font-weight: 500;
        }


        /* ============================= */
        /* EMPTY */
        /* ============================= */

        .empty {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

            background:
                rgba(25, 13, 13, 0.92);

            border: 1px solid #6f5720;

            border-radius: 15px;

            color: #aaa294;
        }


        /* ============================= */
        /* BACK BUTTON */
        /* ============================= */

        .back-button {
            display: inline-block;

            margin-top: 40px;

            padding: 12px 25px;

            color: #15100a;

            background: #d4af37;

            text-decoration: none;

            border-radius: 7px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;
        }

        .back-button:hover {
            background: #f0d878;

            transform: translateY(-2px);
        }


        /* ============================= */
        /* FOOTER */
        /* ============================= */

        footer {
            margin-top: 80px;

            padding: 35px 20px;

            text-align: center;

            background: #0d0606;

            border-top: 1px solid #6f5720;

            color: #aaa294;
        }

        .footer-title {
            color: #d4af37;

            font-family:
                "Playfair Display",
                serif;

            font-size: 21px;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        .footer-instagram {
            color: #d4af37;

            text-decoration: none;

            font-size: 14px;
        }

        .footer-address {
            margin-top: 8px;

            font-size: 13px;

            color: #aaa294;
        }

        .copyright {
            margin-top: 15px;

            font-size: 12px;

            color: #77736b;
        }


        /* ============================= */
        /* MOBILE */
        /* ============================= */

        @media (max-width: 700px) {

            nav {
                gap: 14px;

                padding: 15px 10px;
            }

            nav a {
                font-size: 12px;
            }

            header {
                min-height: 280px;

                padding: 55px 15px;
            }

            header h1 {
                font-size: 38px;

                letter-spacing: 2px;
            }

            header p {
                font-size: 14px;
            }

            .container {
                width: 94%;

                margin: 40px auto;
            }

            .records {
                grid-template-columns: 1fr;
            }

            .record {
                padding: 25px;
            }

            .nimajjanam-photo {
                max-height: 350px;
            }

        }

    </style>

</head>


<body>


<!-- ============================= -->
<!-- NAVIGATION -->
<!-- ============================= -->

<nav>

    <a href="index.html">Home</a>

    <a href="about.html">About</a>

    <a href="events.html">Events</a>

    <a href="festival-years.html">

    <a href="gallery.html">Gallery</a>

    <a href="videos.html">Videos</a>

    <a href="auction.html">

    <a href="nimajjanam.html">

    <a href="sponsors.html">

    <a href="committee.html">

    </a>

    <a href="find-us.html">
        Find Us
    </a>

</nav>


<!-- ============================= -->
<!-- HERO -->
<!-- ============================= -->

<header>

    <h1>NIMAJJANAM</h1>

    <p>
        Procession and immersion details
    </p>

</header>


<!-- ============================= -->
<!-- MAIN -->
<!-- ============================= -->

<div class="container">


    <!-- YEAR FILTER -->

    <div class="filter-box">

        <label for="yearFilter">
            Festival Year:
        </label>

        <select id="yearFilter">

            <option value="">
                All Years
            </option>

        </select>

    </div>


    <!-- RECORDS -->

    <div
        id="records"
        class="records"
    >

        <div class="empty">
            Loading Nimajjanam details...
        </div>

    </div>


    <!-- BACK -->

    <a
        href="index.html"
        class="back-button"
    >
        Back to Home
    </a>

</div>


<!-- ============================= -->
<!-- FOOTER -->
<!-- ============================= -->

<footer>

    <div class="footer-title">
        SRI DURGAMAMBA YOUTH
    </div>

    <a
        class="footer-instagram"
        href="https://www.instagram.com/durga_mamba_youth/"
        target="_blank"
    >
        @durga_mamba_youth
    </a>

    <div class="footer-address">
        Durga Nagar, Saripalli, Pendurthi
    </div>

    <div class="copyright">
        © Sri Durgamamba Youth
    </div>

</footer>


<script>


/* ============================= */
/* API */
/* ============================= */

const API_URL =
    "https://gnesha-festival-backend.onrender.com/api/nimajjanam";

const SERVER_URL =
    "https://gnesha-festival-backend.onrender.com";


/* ============================= */
/* ELEMENTS */
/* ============================= */

const recordsContainer =
    document.getElementById(
        "records"
    );

const yearFilter =
    document.getElementById(
        "yearFilter"
    );


let allRecords = [];


/* ============================= */
/* LOAD RECORDS */
/* ============================= */

async function loadRecords() {

    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Failed to fetch records"
            );

        }


        allRecords =
            await response.json();


        createYearOptions();


        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const selectedYear =
            urlParams.get("year");


        if (selectedYear) {

            yearFilter.value =
                selectedYear;


            const filtered =
                allRecords.filter(
                    record =>
                        String(
                            record.festivalYear
                        ) === selectedYear
                );


            displayRecords(
                filtered
            );

        }
        else {

            displayRecords(
                allRecords
            );

        }

    }
    catch (error) {

        console.log(error);

        recordsContainer.innerHTML =
            `
            <div class="empty">
                Unable to load Nimajjanam details.
            </div>
            `;

    }

}


/* ============================= */
/* YEAR OPTIONS */
/* ============================= */

function createYearOptions() {

    const years =
        [
            ...new Set(
                allRecords.map(
                    record =>
                        record.festivalYear
                )
            )
        ]
        .sort(
            (a, b) => b - a
        );


    years.forEach(
        function(year) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                year;


            option.textContent =
                year;


            yearFilter.appendChild(
                option
            );

        }
    );

}


/* ============================= */
/* YEAR FILTER */
/* ============================= */

yearFilter.addEventListener(
    "change",
    function() {

        const selectedYear =
            this.value;


        if (!selectedYear) {

            displayRecords(
                allRecords
            );

            return;
        }


        const filtered =
            allRecords.filter(
                record =>
                    String(
                        record.festivalYear
                    ) === selectedYear
            );


        displayRecords(
            filtered
        );

    }
);


/* ============================= */
/* DISPLAY RECORDS */
/* ============================= */

function displayRecords(records) {

    if (
        !records ||
        records.length === 0
    ) {

        recordsContainer.innerHTML =
            `
            <div class="empty">
                No Nimajjanam details available.
            </div>
            `;

        return;
    }


    recordsContainer.innerHTML =
        "";


    records.forEach(
        function(record) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "record";


            const date =
                new Date(
                    record.date
                )
                .toLocaleDateString(
                    "en-IN",
                    {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }
                );


            let photoHTML = "";


            if (record.photoUrl) {

                const photoURL =
                    record.photoUrl.startsWith("http")
                        ? record.photoUrl
                        : SERVER_URL + record.photoUrl;


                photoHTML =
                    `
                    <img
                        class="nimajjanam-photo"
                        src="${photoURL}"
                        alt="Nimajjanam"
                    >
                    `;

            }


            card.innerHTML =
                `
                ${photoHTML}

                <span class="year">
                    ${escapeHtml(
                        String(
                            record.festivalYear
                        )
                    )}
                </span>

                <h2>
                    Nimajjanam Details
                </h2>

                <div class="detail">

                    <strong>
                        Date:
                    </strong>

                    ${date}

                </div>

                <div class="detail">

                    <strong>
                        Time:
                    </strong>

                    ${escapeHtml(
                        record.time || ""
                    )}

                </div>

                <div class="detail">

                    <strong>
                        Location:
                    </strong>

                    ${escapeHtml(
                        record.location || ""
                    )}

                </div>

                ${
                    record.description
                    ?
                    `
                    <div class="detail">

                        <strong>
                            Description:
                        </strong>

                        ${escapeHtml(
                            record.description
                        )}

                    </div>
                    `
                    :
                    ""
                }

                `;


            recordsContainer.appendChild(
                card
            );

        }
    );

}


/* ============================= */
/* SECURITY */
/* ============================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* ============================= */
/* START */
/* ============================= */

loadRecords();

</script>


</body>

</html>
