<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Photo Management | Sri Durgamamba Youth
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                "Poppins",
                sans-serif;

            color: #f5f1e8;

            background:
                linear-gradient(
                    rgba(18, 9, 9, 0.92),
                    rgba(18, 9, 9, 0.97)
                ),
                url("images/vinayaka.jpg")
                center / cover fixed no-repeat;
        }

        nav {

            width: 100%;

            padding: 18px 5%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            background:
                rgba(12, 6, 6, 0.96);

            border-bottom:
                1px solid #6f5720;
        }

        .logo {

            font-family:
                "Playfair Display",
                serif;

            font-size: 23px;

            font-weight: 700;

            letter-spacing: 1px;

            color: #d4af37;
        }

        .back-admin {

            padding: 10px 20px;

            border: 1px solid #8b712b;

            border-radius: 7px;

            background: transparent;

            color: #d4af37;

            text-decoration: none;

            font-size: 13px;

            transition: 0.3s;
        }

        .back-admin:hover {

            background: #d4af37;

            color: #15100a;
        }

        .container {

            width: 90%;

            max-width: 1150px;

            margin: 55px auto;
        }

        .heading {

            text-align: center;

            margin-bottom: 40px;
        }

        .heading h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size: 46px;

            color: #d4af37;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        .heading p {

            color: #cfc6b6;

            font-size: 14px;
        }

        .upload-box {

            padding: 32px;

            margin-bottom: 45px;

            background:
                rgba(25, 12, 12, 0.95);

            border: 1px solid #6f5720;

            border-radius: 18px;

            box-shadow:
                0 18px 45px
                rgba(0, 0, 0, 0.45);
        }

        .upload-box h2 {

            font-family:
                "Playfair Display",
                serif;

            color: #d4af37;

            font-size: 28px;

            margin-bottom: 25px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #d4af37;

            font-size: 13px;

            font-weight: 500;
        }

        input {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #5f4b20;

            border-radius: 7px;

            background: #170c0c;

            color: #f5f1e8;

            font-family:
                "Poppins",
                sans-serif;

            font-size: 14px;

            outline: none;
        }

        input:focus {

            border-color: #d4af37;
        }

        input::placeholder {

            color: #80776b;
        }

        input[type="file"] {

            padding: 10px;
        }

        input[type="file"]::file-selector-button {

            margin-right: 12px;

            padding: 8px 14px;

            border: 1px solid #8b712b;

            border-radius: 5px;

            background: #d4af37;

            color: #15100a;

            cursor: pointer;

            font-family:
                "Poppins",
                sans-serif;
        }

        .btn {

            margin-top: 8px;

            padding: 12px 24px;

            border: 1px solid #8b712b;

            border-radius: 7px;

            background: #d4af37;

            color: #15100a;

            font-family:
                "Poppins",
                sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn:hover {

            background: #f0d878;

            transform: translateY(-2px);
        }

        #message {

            margin-top: 15px;

            color: #d4af37;

            font-size: 13px;
        }

        .photo-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }

        .photo-header h2 {

            font-family:
                "Playfair Display",
                serif;

            color: #d4af37;

            font-size: 30px;
        }

        .filter {

            min-width: 170px;

            padding: 11px 14px;

            border: 1px solid #6f5720;

            border-radius: 7px;

            background: #170c0c;

            color: #d4af37;

            font-family:
                "Poppins",
                sans-serif;

            font-size: 13px;

            outline: none;
        }

        .filter:focus {

            border-color: #d4af37;
        }

        .photo-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 24px;
        }

        .photo-card {

            overflow: hidden;

            background:
                rgba(25, 12, 12, 0.96);

            border: 1px solid #6f5720;

            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.40);

            transition: 0.3s;
        }

        .photo-card:hover {

            transform: translateY(-6px);

            border-color: #d4af37;

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.55);
        }

        /* =====================================
           FULL PHOTO DISPLAY
        ===================================== */

        .photo-card img {

            width: 100%;

            height: auto;

            max-height: 500px;

            object-fit: contain;

            object-position: center;

            display: block;

            background: #111;

            border-bottom:
                1px solid #6f5720;
        }

        .photo-info {

            padding: 18px;
        }

        .photo-info h3 {

            font-family:
                "Playfair Display",
                serif;

            color: #d4af37;

            font-size: 21px;

            margin-bottom: 12px;
        }

        .photo-info p {

            color: #cfc6b6;

            font-size: 13px;

            margin-bottom: 7px;

            line-height: 1.6;
        }

        .photo-info strong {

            color: #d4af37;
        }

        .delete-btn {

            width: 100%;

            margin-top: 12px;

            padding: 10px;

            border: 1px solid #71333b;

            border-radius: 6px;

            background: #5a2028;

            color: #f5e9e9;

            cursor: pointer;

            font-family:
                "Poppins",
                sans-serif;

            font-size: 13px;

            transition: 0.3s;
        }

        .delete-btn:hover {

            background: #7c2d38;
        }

        .empty,
        .loading {

            grid-column: 1 / -1;

            text-align: center;

            padding: 45px;

            color: #aaa294;

            background:
                rgba(25, 12, 12, 0.95);

            border: 1px solid #6f5720;

            border-radius: 15px;
        }

        footer {

            margin-top: 70px;

            padding: 35px 20px;

            text-align: center;

            background: #0d0606;

            border-top:
                1px solid #6f5720;

            color: #aaa294;

            font-size: 13px;

            line-height: 1.8;
        }

        .footer-title {

            font-family:
                "Playfair Display",
                serif;

            color: #d4af37;

            font-size: 21px;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }

        .footer-instagram {

            color: #d4af37;
        }

        .footer-address {

            margin-top: 5px;
        }

        .copyright {

            margin-top: 10px;

            color: #77736b;

            font-size: 12px;
        }

        @media (max-width: 600px) {

            .container {

                width: 94%;

                margin: 40px auto;
            }

            nav {

                padding: 15px 5%;
            }

            .logo {

                font-size: 18px;
            }

            .back-admin {

                padding: 8px 13px;

                font-size: 11px;
            }

            .heading h1 {

                font-size: 35px;
            }

            .upload-box {

                padding: 22px;
            }

            .upload-box h2 {

                font-size: 24px;
            }

            .photo-header {

                align-items: stretch;
            }

            .photo-header h2 {

                font-size: 25px;
            }

            .filter {

                width: 100%;
            }

            .photo-grid {

                grid-template-columns: 1fr;
            }

            .photo-card img {

                width: 100%;

                height: auto;

                max-height: 500px;

                object-fit: contain;
            }
        }

    </style>

</head>

<body>

<nav>

    <div class="logo">
        Sri Durgamamba Youth
    </div>

    <a
        href="admin.html"
        class="back-admin">

        Back to Admin

    </a>

</nav>


<div class="container">

    <div class="heading">

        <h1>
            Photo Management
        </h1>

        <p>
            Upload and manage festival memories
        </p>

    </div>


    <div class="upload-box">

        <h2>
            Upload Festival Photo
        </h2>

        <form id="photoForm">

            <div class="form-group">

                <label for="festivalYear">
                    Festival Year
                </label>

                <input
                    type="number"
                    id="festivalYear"
                    placeholder="Enter festival year"
                    required
                >

            </div>


            <div class="form-group">

                <label for="event">
                    Festival Event
                </label>

                <input
                    type="text"
                    id="event"
                    placeholder="Example: Ganesh Chaturthi"
                    required
                >

            </div>


            <div class="form-group">

                <label for="title">
                    Photo Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter photo title"
                    required
                >

            </div>


            <div class="form-group">

                <label for="photo">
                    Select Photo
                </label>

                <input
                    type="file"
                    id="photo"
                    accept="image/*"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn">

                Upload Photo

            </button>

        </form>

        <p id="message"></p>

    </div>


    <div class="photo-header">

        <h2>
            Uploaded Photos
        </h2>

        <select
            id="yearFilter"
            class="filter">

            <option value="all">
                All Years
            </option>

        </select>

    </div>


    <div
        id="photoGrid"
        class="photo-grid">

        <div class="loading">
            Loading photos...
        </div>

    </div>

</div>


<footer>

    <div class="footer-title">
        SRI DURGAMAMBA YOUTH
    </div>

    <div class="footer-instagram">
        @durga_mamba_youth
    </div>

    <div class="footer-address">
        Durga Nagar, Saripalli, Pendurthi
    </div>

    <div class="copyright">
        © Sri Durgamamba Youth
    </div>

</footer>


<script>

const API_URL = "https://gnesha-festival-backend.onrender.com";

const token =
    localStorage.getItem("token");

if (!token) {

    window.location.href =
        "login.html";
}


const photoForm =
    document.getElementById(
        "photoForm"
    );

const photoGrid =
    document.getElementById(
        "photoGrid"
    );

const yearFilter =
    document.getElementById(
        "yearFilter"
    );

const message =
    document.getElementById(
        "message"
    );


let allPhotos = [];


async function loadPhotos() {

    try {

        const response =
            await fetch(
                `${API_URL}/api/photos`
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load photos."
            );
        }

        allPhotos = data;

        createYearFilter();

        displayPhotos(allPhotos);

    }
    catch (error) {

        console.error(
            "Load photos error:",
            error
        );

        photoGrid.innerHTML = `
            <div class="empty">
                Unable to load photos.
            </div>
        `;
    }
}


function createYearFilter() {

    yearFilter.innerHTML = `
        <option value="all">
            All Years
        </option>
    `;

    const years = new Set();

    allPhotos.forEach(
        photo => {

            if (photo.festivalYear) {

                years.add(
                    Number(
                        photo.festivalYear
                    )
                );
            }
        }
    );


    [...years]
        .sort(
            (a, b) => b - a
        )
        .forEach(
            year => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = year;

                option.textContent = year;

                yearFilter.appendChild(
                    option
                );
            }
        );
}


function displayPhotos(photos) {

    photoGrid.innerHTML = "";

    if (
        !photos ||
        photos.length === 0
    ) {

        photoGrid.innerHTML = `
            <div class="empty">
                No photos found.
            </div>
        `;

        return;
    }


    photos.forEach(
        photo => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "photo-card";


            const imageUrl =
                `${API_URL}${photo.imageUrl}`;


            card.innerHTML = `

                <img
                    src="${imageUrl}"
                    alt="${escapeHTML(
                        photo.title ||
                        "Festival Photo"
                    )}"
                    onerror="
                        this.alt='Image unavailable';
                    "
                >

                <div class="photo-info">

                    <h3>
                        ${escapeHTML(
                            photo.title ||
                            "Untitled"
                        )}
                    </h3>

                    <p>
                        <strong>
                            Year:
                        </strong>

                        ${escapeHTML(
                            photo.festivalYear
                        )}
                    </p>

                    <p>
                        <strong>
                            Event:
                        </strong>

                        ${escapeHTML(
                            photo.event ||
                            ""
                        )}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="
                            deletePhoto(
                                '${photo._id}'
                            )
                        ">

                        Delete Photo

                    </button>

                </div>
            `;


            photoGrid.appendChild(card);

        }
    );
}


yearFilter.addEventListener(
    "change",
    function() {

        const selected =
            this.value;

        if (selected === "all") {

            displayPhotos(
                allPhotos
            );

            return;
        }


        const filtered =
            allPhotos.filter(
                photo =>
                    String(
                        photo.festivalYear
                    ) === selected
            );


        displayPhotos(filtered);

    }
);


photoForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const festivalYear =
            document.getElementById(
                "festivalYear"
            ).value;


        const festivalEvent =
            document.getElementById(
                "event"
            ).value.trim();


        const title =
            document.getElementById(
                "title"
            ).value.trim();


        const photo =
            document.getElementById(
                "photo"
            ).files[0];


        if (!photo) {

            message.textContent =
                "Please select a photo.";

            return;
        }


        const formData =
            new FormData();


        formData.append(
            "festivalYear",
            festivalYear
        );


        formData.append(
            "event",
            festivalEvent
        );


        formData.append(
            "title",
            title
        );


        formData.append(
            "photo",
            photo
        );


        message.textContent =
            "Uploading photo...";


        try {

            const response =
                await fetch(
                    `${API_URL}/api/photos`,
                    {

                        method: "POST",

                        headers: {

                            "Authorization":
                                "Bearer " +
                                token
                        },

                        body:
                            formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Upload failed.";

                return;
            }


            message.textContent =
                "Photo uploaded successfully!";


            photoForm.reset();


            await loadPhotos();

        }
        catch (error) {

            console.error(
                "Upload error:",
                error
            );

            message.textContent =
                "Unable to connect to server.";
        }

    }
);


async function deletePhoto(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this photo?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/photos/${id}`,
                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token
                    }

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to delete photo."
            );

            return;
        }


        alert(
            "Photo deleted successfully."
        );


        await loadPhotos();

    }
    catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Unable to connect to server."
        );
    }

}


function escapeHTML(value) {

    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


loadPhotos();

</script>

</body>

</html>
