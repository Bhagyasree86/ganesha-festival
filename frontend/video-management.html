<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Manage Videos | Sri Durgamamba Youth
    </title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                "Poppins",
                sans-serif;

            color: #f5f1e8;

            background:

                linear-gradient(
                    rgba(18, 9, 9, 0.92),
                    rgba(18, 9, 9, 0.97)
                ),

                url("images/vinayaka.jpg")
                center / cover fixed no-repeat;

        }


        /* ==============================
           NAVBAR
        ============================== */

        nav {

            width: 100%;

            padding: 18px 5%;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            background:
                rgba(12, 6, 6, 0.96);

            border-bottom:
                1px solid #6f5720;

        }


        .logo {

            font-family:
                "Playfair Display",
                serif;

            font-size: 23px;

            font-weight: 700;

            letter-spacing: 1px;

            color: #d4af37;

        }


        .nav-btn {

            text-decoration: none;

            color: #d4af37;

            border:
                1px solid #8b712b;

            padding:
                10px 20px;

            border-radius: 7px;

            font-size: 13px;

            transition: 0.3s;

        }


        .nav-btn:hover {

            background: #d4af37;

            color: #15100a;

        }


        /* ==============================
           CONTAINER
        ============================== */

        .container {

            width: 90%;

            max-width: 1150px;

            margin: 55px auto;

        }


        /* ==============================
           HEADER
        ============================== */

        .header {

            text-align: center;

            margin-bottom: 35px;

        }


        .header h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size: 46px;

            color: #d4af37;

            letter-spacing: 1px;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #cfc6b6;

            font-size: 14px;

        }


        /* ==============================
           CONTROLS
        ============================== */

        .controls {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            padding: 22px;

            margin-bottom: 30px;

            background:
                rgba(25, 12, 12, 0.96);

            border:
                1px solid #6f5720;

            border-radius: 15px;

        }


        .controls input {

            flex: 1;

            min-width: 220px;

            padding: 13px 15px;

            border:
                1px solid #6f5720;

            border-radius: 7px;

            background:
                #160b0b;

            color: #f5f1e8;

            font-family:
                "Poppins",
                sans-serif;

            outline: none;

        }


        .controls input::placeholder {

            color: #888074;

        }


        .controls input:focus {

            border-color:
                #d4af37;

        }


        .btn {

            border: none;

            padding:
                13px 21px;

            border-radius: 7px;

            cursor: pointer;

            font-family:
                "Poppins",
                sans-serif;

            font-weight: 600;

            transition: 0.3s;

        }


        .filter-btn {

            background:
                #d4af37;

            color:
                #15100a;

        }


        .filter-btn:hover {

            background:
                #f0d878;

        }


        .all-btn {

            background:
                #33261a;

            color:
                #d4af37;

            border:
                1px solid #6f5720;

        }


        .all-btn:hover {

            background:
                #47351f;

        }


        /* ==============================
           VIDEOS GRID
        ============================== */

        .videos {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(310px, 1fr)
                );

            gap: 25px;

        }


        /* ==============================
           VIDEO CARD
        ============================== */

        .video-card {

            position: relative;

            overflow: hidden;

            background:
                rgba(25, 12, 12, 0.96);

            border:
                1px solid #6f5720;

            border-radius: 17px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.45);

            transition: 0.3s;

        }


        .video-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 3px;

            background:
                #d4af37;

            z-index: 2;

        }


        .video-card:hover {

            transform:
                translateY(-6px);

            border-color:
                #d4af37;

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.55);

        }


        /* ==============================
           VIDEO
        ============================== */

        .video-card video {

            width: 100%;

            height: 220px;

            display: block;

            background:
                #050505;

            object-fit: cover;

        }


        /* ==============================
           VIDEO CONTENT
        ============================== */

        .video-content {

            padding: 21px;

        }


        .year {

            display: inline-block;

            padding:
                5px 12px;

            margin-bottom:
                12px;

            border:
                1px solid #6f5720;

            border-radius:
                20px;

            background:
                rgba(
                    212,
                    175,
                    55,
                    0.10
                );

            color:
                #d4af37;

            font-size:
                12px;

            font-weight:
                600;

        }


        .video-title {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                23px;

            color:
                #d4af37;

            margin-bottom:
                10px;

        }


        .description {

            color:
                #aaa294;

            font-size:
                13px;

            line-height:
                1.7;

            min-height:
                44px;

            margin-bottom:
                18px;

        }


        /* ==============================
           DELETE
        ============================== */

        .delete-btn {

            width: 100%;

            padding:
                11px;

            border:
                1px solid #71333b;

            border-radius:
                7px;

            background:
                #5a2028;

            color:
                #f5e9e9;

            cursor:
                pointer;

            font-family:
                "Poppins",
                sans-serif;

            font-weight:
                600;

            transition:
                0.3s;

        }


        .delete-btn:hover {

            background:
                #7c2d38;

        }


        /* ==============================
           MESSAGE
        ============================== */

        #message {

            text-align:
                center;

            color:
                #aaa294;

            padding:
                35px;

            font-size:
                14px;

        }


        /* ==============================
           BOTTOM BUTTONS
        ============================== */

        .bottom-actions {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                12px;

            flex-wrap:
                wrap;

            margin-top:
                40px;

        }


        .back-btn {

            display:
                inline-block;

            padding:
                12px 23px;

            border-radius:
                7px;

            text-decoration:
                none;

            font-size:
                13px;

            font-weight:
                600;

            transition:
                0.3s;

        }


        .upload-btn {

            background:
                #d4af37;

            color:
                #15100a;

            border:
                1px solid #d4af37;

        }


        .upload-btn:hover {

            background:
                #f0d878;

        }


        .admin-btn {

            background:
                #33261a;

            color:
                #d4af37;

            border:
                1px solid #6f5720;

        }


        .admin-btn:hover {

            background:
                #47351f;

        }


        /* ==============================
           FOOTER
        ============================== */

        footer {

            margin-top:
                70px;

            padding:
                35px 20px;

            text-align:
                center;

            background:
                #0d0606;

            border-top:
                1px solid #6f5720;

            color:
                #aaa294;

            font-size:
                13px;

            line-height:
                1.8;

        }


        .footer-title {

            font-family:
                "Playfair Display",
                serif;

            color:
                #d4af37;

            font-size:
                21px;

            letter-spacing:
                1px;

            margin-bottom:
                8px;

        }


        .footer-instagram {

            color:
                #d4af37;

        }


        .copyright {

            color:
                #77736b;

            font-size:
                12px;

            margin-top:
                10px;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .container {

                width: 94%;

                margin:
                    40px auto;

            }


            .header h1 {

                font-size:
                    35px;

            }


            .controls {

                padding:
                    17px;

            }


            .controls input {

                width:
                    100%;

            }


            .btn {

                flex: 1;

            }


            .videos {

                grid-template-columns:
                    1fr;

            }


            .video-card video {

                height:
                    220px;

            }


            .logo {

                font-size:
                    18px;

            }


            .nav-btn {

                padding:
                    8px 13px;

                font-size:
                    11px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================
     NAVBAR
===================================== -->

<nav>

    <div class="logo">

        Sri Durgamamba Youth

    </div>


    <a
        href="admin.html"
        class="nav-btn">

        Admin Dashboard

    </a>

</nav>



<!-- =====================================
     MAIN
===================================== -->

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Festival Videos
        </h1>

        <p class="subtitle">

            Manage uploaded festival videos

        </p>

    </div>



    <!-- =====================================
         FILTER
    ===================================== -->

    <div class="controls">


        <input
            type="number"
            id="yearInput"
            placeholder="Enter festival year"
        >


        <button
            class="btn filter-btn"
            onclick="filterVideos()">

            Filter

        </button>


        <button
            class="btn all-btn"
            onclick="loadVideos()">

            Show All

        </button>


    </div>



    <!-- =====================================
         VIDEOS
    ===================================== -->

    <div
        class="videos"
        id="videosContainer">

    </div>


    <p id="message">

        Loading videos...

    </p>



    <!-- =====================================
         BUTTONS
    ===================================== -->

    <div class="bottom-actions">


        <a
            href="video-upload.html"
            class="back-btn upload-btn">

            + Upload New Video

        </a>


        <a
            href="admin.html"
            class="back-btn admin-btn">

            ← Back to Admin Dashboard

        </a>


    </div>


</div>



<!-- =====================================
     FOOTER
===================================== -->

<footer>


    <div class="footer-title">

        SRI DURGAMAMBA YOUTH

    </div>


    <div class="footer-instagram">

        @durga_mamba_youth

    </div>


    <div>

        Durga Nagar, Saripalli, Pendurthi

    </div>


    <div class="copyright">

        © Sri Durgamamba Youth

    </div>


</footer>



<script>


// ==========================================
// API
// ==========================================

const API =
    "https://gnesha-festival-backend.onrender.com/api/videos";


let allVideos = [];


// ==========================================
// LOAD VIDEOS
// ==========================================

async function loadVideos() {


    const message =
        document.getElementById(
            "message"
        );


    const container =
        document.getElementById(
            "videosContainer"
        );


    message.textContent =
        "Loading videos...";


    try {


        const response =
            await fetch(API);


        if (!response.ok) {

            throw new Error(
                "Unable to load videos."
            );

        }


        allVideos =
            await response.json();


        displayVideos(
            allVideos
        );


    }


    catch (error) {


        console.error(
            error
        );


        container.innerHTML =
            "";


        message.textContent =
            "Unable to load videos.";

    }

}


// ==========================================
// DISPLAY VIDEOS
// ==========================================

function displayVideos(
    videos
) {


    const container =
        document.getElementById(
            "videosContainer"
        );


    const message =
        document.getElementById(
            "message"
        );


    container.innerHTML =
        "";


    if (
        videos.length === 0
    ) {


        message.textContent =
            "No videos found.";


        return;

    }


    message.textContent =
        "";


    videos.forEach(
        video => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "video-card";


            card.innerHTML = `

                <video
                    controls
                    preload="metadata"
                    src="${escapeHTML(video.videoUrl)}">
                </video>


                <div class="video-content">


                    <span class="year">

                        ${escapeHTML(
                            video.festivalYear
                        )}

                    </span>


                    <h2 class="video-title">

                        ${escapeHTML(
                            video.title
                        )}

                    </h2>


                    <p class="description">

                        ${
                            escapeHTML(
                                video.description || ""
                            )
                        }

                    </p>


                    <button
                        class="delete-btn"
                        onclick="
                            deleteVideo(
                                '${video._id}'
                            )
                        ">

                        Delete Video

                    </button>


                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


// ==========================================
// FILTER BY YEAR
// ==========================================

function filterVideos() {


    const year =
        document.getElementById(
            "yearInput"
        ).value;


    if (!year) {


        alert(
            "Please enter a festival year."
        );


        return;

    }


    const filtered =
        allVideos.filter(
            video =>
                String(
                    video.festivalYear
                ) === String(year)
        );


    displayVideos(
        filtered
    );

}


// ==========================================
// DELETE VIDEO
// ==========================================

async function deleteVideo(
    id
) {


    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {


        alert(
            "Please login again."
        );


        window.location.href =
            "login.html";


        return;

    }


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this video?"
        );


    if (!confirmDelete) {

        return;

    }


    try {


        const response =
            await fetch(
                `${API}/${id}`,
                {

                    method:
                        "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }
            );


        const result =
            await response.json();


        if (!response.ok) {


            alert(
                result.message ||
                "Failed to delete video."
            );


            return;

        }


        alert(
            "Video deleted successfully."
        );


        loadVideos();


    }


    catch (error) {


        console.error(
            error
        );


        alert(
            "Unable to connect to server."
        );

    }

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(
    text
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


// ==========================================
// START
// ==========================================

loadVideos();

</script>


</body>

</html>
