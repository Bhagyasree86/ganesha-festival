<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sponsor Management | Sri Durgamamba Youth</title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==============================
           BODY
        ============================== */

        body {

            min-height: 100vh;

            font-family:
                "Poppins",
                sans-serif;

            color: #f5f1e8;

            background:

                linear-gradient(
                    rgba(18, 9, 9, 0.92),
                    rgba(18, 9, 9, 0.97)
                ),

                url("images/vinayaka.jpg")
                center / cover fixed no-repeat;

        }


        /* ==============================
           NAVBAR
        ============================== */

        nav {

            width: 100%;

            padding:
                18px 5%;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            background:
                rgba(
                    12,
                    6,
                    6,
                    0.96
                );

            border-bottom:
                1px solid #6f5720;

        }


        .logo {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                23px;

            font-weight:
                700;

            letter-spacing:
                1px;

            color:
                #d4af37;

        }


        .nav-btn {

            text-decoration:
                none;

            color:
                #d4af37;

            border:
                1px solid #8b712b;

            padding:
                10px 20px;

            border-radius:
                7px;

            font-size:
                13px;

            transition:
                0.3s;

        }


        .nav-btn:hover {

            background:
                #d4af37;

            color:
                #15100a;

        }


        /* ==============================
           CONTAINER
        ============================== */

        .container {

            width:
                90%;

            max-width:
                1000px;

            margin:
                55px auto;

        }


        /* ==============================
           PAGE HEADING
        ============================== */

        .page-heading {

            text-align:
                center;

            margin-bottom:
                35px;

        }


        .page-heading h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                45px;

            color:
                #d4af37;

            letter-spacing:
                1px;

            margin-bottom:
                10px;

        }


        .page-heading p {

            color:
                #cfc6b6;

            font-size:
                14px;

        }


        /* ==============================
           CARD
        ============================== */

        .card {

            position:
                relative;

            background:
                rgba(
                    25,
                    12,
                    12,
                    0.96
                );

            border:
                1px solid #6f5720;

            border-radius:
                17px;

            padding:
                28px;

            margin-bottom:
                28px;

            box-shadow:
                0 15px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

        }


        .card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                100%;

            height:
                3px;

            background:
                #d4af37;

            border-radius:
                17px 17px 0 0;

        }


        .card h2 {

            font-family:
                "Playfair Display",
                serif;

            color:
                #d4af37;

            font-size:
                28px;

            margin-bottom:
                22px;

        }


        /* ==============================
           FORM
        ============================== */

        label {

            display:
                block;

            margin-top:
                16px;

            margin-bottom:
                7px;

            color:
                #d4af37;

            font-size:
                13px;

            font-weight:
                600;

        }


        input,
        textarea {

            width:
                100%;

            padding:
                13px 14px;

            border:
                1px solid #6f5720;

            border-radius:
                7px;

            background:
                #160b0b;

            color:
                #f5f1e8;

            font-family:
                "Poppins",
                sans-serif;

            font-size:
                14px;

            outline:
                none;

        }


        input:focus,
        textarea:focus {

            border-color:
                #d4af37;

        }


        input::placeholder,
        textarea::placeholder {

            color:
                #77736b;

        }


        textarea {

            min-height:
                100px;

            resize:
                vertical;

        }


        /* ==============================
           FILE INPUT
        ============================== */

        input[type="file"] {

            padding:
                10px;

            cursor:
                pointer;

        }


        input[type="file"]::file-selector-button {

            margin-right:
                12px;

            padding:
                8px 14px;

            border:
                1px solid #8b712b;

            border-radius:
                6px;

            background:
                #33261a;

            color:
                #d4af37;

            font-family:
                "Poppins",
                sans-serif;

            cursor:
                pointer;

        }


        input[type="file"]::file-selector-button:hover {

            background:
                #d4af37;

            color:
                #15100a;

        }


        /* ==============================
           PHOTO PREVIEW
        ============================== */

        .preview-container {

            display:
                none;

            margin-top:
                20px;

            text-align:
                center;

        }


        .preview-container p {

            color:
                #d4af37;

            font-size:
                13px;

            margin-bottom:
                10px;

        }


        #photoPreview {

            width:
                100%;

            max-width:
                350px;

            max-height:
                350px;

            object-fit:
                contain;

            border:
                1px solid #6f5720;

            border-radius:
                10px;

            background:
                #0d0606;

        }


        /* ==============================
           ADD BUTTON
        ============================== */

        .add-btn {

            margin-top:
                22px;

            padding:
                12px 25px;

            border:
                1px solid #d4af37;

            border-radius:
                7px;

            background:
                #d4af37;

            color:
                #15100a;

            font-family:
                "Poppins",
                sans-serif;

            font-size:
                14px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                0.3s;

        }


        .add-btn:hover {

            background:
                #f0d878;

        }


        .add-btn:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {

            margin-top:
                15px;

            color:
                #d4af37;

            font-size:
                13px;

            font-weight:
                500;

        }


        /* ==============================
           SPONSOR LIST
        ============================== */

        #sponsorList {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap:
                20px;

        }


        /* ==============================
           SPONSOR
        ============================== */

        .sponsor {

            padding:
                22px;

            border-radius:
                12px;

            background:
                rgba(
                    18,
                    9,
                    9,
                    0.85
                );

            border:
                1px solid #59471d;

            transition:
                0.3s;

        }


        .sponsor:hover {

            border-color:
                #d4af37;

            transform:
                translateY(-3px);

        }


        /* ==============================
           SPONSOR PHOTO
        ============================== */

        .sponsor-photo {

            width:
                100%;

            max-height:
                300px;

            object-fit:
                contain;

            display:
                block;

            margin:
                0 auto 20px;

            border:
                1px solid #6f5720;

            border-radius:
                10px;

            background:
                #0d0606;

        }


        .no-photo {

            height:
                180px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin-bottom:
                20px;

            border:
                1px solid #59471d;

            border-radius:
                10px;

            color:
                #77736b;

            font-size:
                13px;

            background:
                #0d0606;

        }


        .sponsor h3 {

            font-family:
                "Playfair Display",
                serif;

            color:
                #d4af37;

            font-size:
                23px;

            margin-bottom:
                14px;

        }


        .sponsor p {

            color:
                #cfc6b6;

            font-size:
                13px;

            line-height:
                1.8;

            margin:
                5px 0;

        }


        .sponsor strong {

            color:
                #d4af37;

        }


        /* ==============================
           DELETE BUTTON
        ============================== */

        .delete-btn {

            margin-top:
                15px;

            padding:
                9px 18px;

            border:
                1px solid #71333b;

            border-radius:
                7px;

            background:
                #5a2028;

            color:
                #f5e9e9;

            cursor:
                pointer;

            font-family:
                "Poppins",
                sans-serif;

            font-size:
                12px;

            font-weight:
                600;

            transition:
                0.3s;

        }


        .delete-btn:hover {

            background:
                #7c2d38;

        }


        /* ==============================
           EMPTY
        ============================== */

        .empty {

            text-align:
                center;

            padding:
                35px 20px;

            color:
                #aaa294;

            font-size:
                14px;

        }


        /* ==============================
           BACK BUTTON
        ============================== */

        .bottom-actions {

            text-align:
                center;

            margin-top:
                35px;

        }


        .back-button {

            display:
                inline-block;

            padding:
                12px 24px;

            border:
                1px solid #6f5720;

            border-radius:
                7px;

            background:
                #33261a;

            color:
                #d4af37;

            text-decoration:
                none;

            font-size:
                13px;

            font-weight:
                600;

            transition:
                0.3s;

        }


        .back-button:hover {

            background:
                #d4af37;

            color:
                #15100a;

        }


        /* ==============================
           FOOTER
        ============================== */

        footer {

            margin-top:
                70px;

            padding:
                35px 20px;

            text-align:
                center;

            background:
                #0d0606;

            border-top:
                1px solid #6f5720;

            color:
                #aaa294;

            font-size:
                13px;

            line-height:
                1.8;

        }


        .footer-title {

            font-family:
                "Playfair Display",
                serif;

            color:
                #d4af37;

            font-size:
                21px;

            letter-spacing:
                1px;

            margin-bottom:
                8px;

        }


        .footer-instagram {

            color:
                #d4af37;

        }


        .copyright {

            color:
                #77736b;

            font-size:
                12px;

            margin-top:
                10px;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .container {

                width:
                    94%;

                margin:
                    40px auto;

            }


            .page-heading h1 {

                font-size:
                    34px;

            }


            .card {

                padding:
                    21px;

            }


            .card h2 {

                font-size:
                    24px;

            }


            .logo {

                font-size:
                    18px;

            }


            .nav-btn {

                padding:
                    8px 13px;

                font-size:
                    11px;

            }


            #sponsorList {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- =====================================
     NAVBAR
===================================== -->

<nav>

    <div class="logo">

        Sri Durgamamba Youth

    </div>


    <a
        href="admin.html"
        class="nav-btn">

        Admin Dashboard

    </a>

</nav>



<!-- =====================================
     MAIN
===================================== -->

<div class="container">


    <!-- PAGE HEADING -->

    <div class="page-heading">

        <h1>
            Sponsor Management
        </h1>

        <p>
            Add and manage festival sponsors
        </p>

    </div>



    <!-- =====================================
         ADD SPONSOR
    ===================================== -->

    <div class="card">

        <h2>
            Add Sponsor
        </h2>


        <!-- FESTIVAL YEAR -->

        <label for="festivalYear">

            Festival Year

        </label>

        <input
            type="number"
            id="festivalYear"
            placeholder="Enter festival year"
        >


        <!-- SPONSOR NAME -->

        <label for="sponsorName">

            Sponsor Name

        </label>

        <input
            type="text"
            id="sponsorName"
            placeholder="Enter sponsor name"
        >


        <!-- AMOUNT -->

        <label for="amount">

            Sponsorship Amount

        </label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="0"
        >


        <!-- PHOTO -->

        <label for="photo">

            Sponsor Photo

        </label>

        <input
            type="file"
            id="photo"
            accept="
                image/jpeg,
                image/png,
                image/jpg,
                image/webp
            "
        >


        <!-- PHOTO PREVIEW -->

        <div
            class="preview-container"
            id="previewContainer"
        >

            <p>
                Photo Preview
            </p>

            <img
                id="photoPreview"
                alt="Sponsor photo preview"
            >

        </div>


        <!-- DESCRIPTION -->

        <label for="description">

            Description

        </label>

        <textarea
            id="description"
            placeholder="Enter sponsor details"
        ></textarea>


        <!-- BUTTON -->

        <button
            class="add-btn"
            id="addButton"
            onclick="addSponsor()">

            Add Sponsor

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>

    </div>



    <!-- =====================================
         EXISTING SPONSORS
    ===================================== -->

    <div class="card">

        <h2>
            Existing Sponsors
        </h2>


        <div id="sponsorList">

            <div class="empty">

                Loading sponsors...

            </div>

        </div>

    </div>



    <!-- =====================================
         BACK BUTTON
    ===================================== -->

    <div class="bottom-actions">

        <a
            href="admin.html"
            class="back-button">

            ← Back to Admin Dashboard

        </a>

    </div>


</div>



<!-- =====================================
     FOOTER
===================================== -->

<footer>


    <div class="footer-title">

        SRI DURGAMAMBA YOUTH

    </div>


    <div class="footer-instagram">

        @durga_mamba_youth

    </div>


    <div>

        Durga Nagar, Saripalli, Pendurthi

    </div>


    <div class="copyright">

        © Sri Durgamamba Youth

    </div>


</footer>



<script>


/* ======================================
   API
====================================== */

const API_URL =
    "http://localhost:5000/api/sponsors";

const SERVER_URL =
    "http://localhost:5000";


/* ======================================
   ELEMENTS
====================================== */

const sponsorList =
    document.getElementById(
        "sponsorList"
    );


const message =
    document.getElementById(
        "message"
    );


const photoInput =
    document.getElementById(
        "photo"
    );


const previewContainer =
    document.getElementById(
        "previewContainer"
    );


const photoPreview =
    document.getElementById(
        "photoPreview"
    );


const addButton =
    document.getElementById(
        "addButton"
    );


/* ======================================
   PHOTO PREVIEW
====================================== */

photoInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];


        if (!file) {

            previewContainer.style.display =
                "none";

            photoPreview.src =
                "";

            return;

        }


        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/jpg",
            "image/webp"
        ];


        if (
            !allowedTypes.includes(
                file.type
            )
        ) {

            alert(
                "Please select a JPG, JPEG, PNG or WebP image."
            );

            this.value = "";

            previewContainer.style.display =
                "none";

            return;

        }


        /* Maximum 10 MB */

        if (
            file.size >
            10 * 1024 * 1024
        ) {

            alert(
                "Photo size must be less than 10 MB."
            );

            this.value = "";

            previewContainer.style.display =
                "none";

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                photoPreview.src =
                    event.target.result;

                previewContainer.style.display =
                    "block";

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* ======================================
   ADD SPONSOR
====================================== */

async function addSponsor() {


    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

        return;

    }


    const festivalYear =
        document.getElementById(
            "festivalYear"
        ).value;


    const sponsorName =
        document.getElementById(
            "sponsorName"
        ).value.trim();


    const amount =
        document.getElementById(
            "amount"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const photo =
        photoInput.files[0];


    /* ==================================
       VALIDATION
    ================================== */

    if (
        !festivalYear ||
        !sponsorName
    ) {

        message.textContent =
            "Please enter festival year and sponsor name.";

        return;

    }


    if (photo && photo.size > 10 * 1024 * 1024) {

        message.textContent =
            "Photo size must be less than 10 MB.";

        return;

    }


    try {


        addButton.disabled =
            true;

        addButton.textContent =
            "Adding Sponsor...";


        /* ==================================
           FORM DATA
        ================================== */

        const formData =
            new FormData();


        formData.append(
            "festivalYear",
            festivalYear
        );


        formData.append(
            "sponsorName",
            sponsorName
        );


        formData.append(
            "amount",
            amount || "0"
        );


        formData.append(
            "description",
            description
        );


        if (photo) {

            formData.append(
                "photo",
                photo
            );

        }


        /* ==================================
           SEND REQUEST
        ================================== */

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body:
                        formData

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to add sponsor."
            );

        }


        message.textContent =
            "Sponsor added successfully!";


        /* ==================================
           CLEAR FORM
        ================================== */

        document.getElementById(
            "festivalYear"
        ).value = "";


        document.getElementById(
            "sponsorName"
        ).value = "";


        document.getElementById(
            "amount"
        ).value = "";


        document.getElementById(
            "description"
        ).value = "";


        photoInput.value =
            "";


        previewContainer.style.display =
            "none";


        photoPreview.src =
            "";


        /* ==================================
           RELOAD
        ================================== */

        loadSponsors();

    }


    catch (error) {

        console.error(
            error
        );


        message.textContent =
            error.message;

    }


    finally {

        addButton.disabled =
            false;

        addButton.textContent =
            "Add Sponsor";

    }

}


/* ======================================
   LOAD SPONSORS
====================================== */

async function loadSponsors() {

    try {

        const response =
            await fetch(
                API_URL
            );


        if (!response.ok) {

            throw new Error(
                "Failed to fetch sponsors."
            );

        }


        const sponsors =
            await response.json();


        displaySponsors(
            sponsors
        );

    }


    catch (error) {

        console.error(
            error
        );


        sponsorList.innerHTML =
            `

            <div class="empty">

                Unable to load sponsors.

            </div>

            `;

    }

}


/* ======================================
   DISPLAY SPONSORS
====================================== */

function displaySponsors(
    sponsors
) {


    if (
        !sponsors ||
        sponsors.length === 0
    ) {

        sponsorList.innerHTML =
            `

            <div class="empty">

                No sponsors added yet.

            </div>

            `;

        return;

    }


    sponsorList.innerHTML =
        "";


    sponsors.forEach(
        sponsor => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "sponsor";


            let photoHTML =
                `

                <div class="no-photo">

                    No sponsor photo

                </div>

                `;


            if (
                sponsor.photoUrl
            ) {


                const photoURL =
                    sponsor.photoUrl.startsWith(
                        "http"
                    )
                    ?
                    sponsor.photoUrl
                    :
                    SERVER_URL +
                    sponsor.photoUrl;


                photoHTML =
                    `

                    <img

                        class="sponsor-photo"

                        src="${photoURL}"

                        alt="${escapeHtml(
                            sponsor.sponsorName ||
                            "Sponsor"
                        )}"

                    >

                    `;

            }


            div.innerHTML =
                `

                ${photoHTML}


                <h3>

                    ${escapeHtml(
                        sponsor.sponsorName
                    )}

                </h3>


                <p>

                    <strong>
                        Festival Year:
                    </strong>

                    ${escapeHtml(
                        String(
                            sponsor.festivalYear
                        )
                    )}

                </p>


                <p>

                    <strong>
                        Amount:
                    </strong>

                    ₹${Number(
                        sponsor.amount || 0
                    ).toLocaleString(
                        "en-IN"
                    )}

                </p>


                ${
                    sponsor.description
                    ?
                    `

                    <p>

                        <strong>
                            Description:
                        </strong>

                        ${escapeHtml(
                            sponsor.description
                        )}

                    </p>

                    `
                    :
                    ""
                }


                <button

                    class="delete-btn"

                    onclick="
                        deleteSponsor(
                            '${sponsor._id}'
                        )
                    "

                >

                    Delete

                </button>

                `;


            sponsorList.appendChild(
                div
            );

        }
    );

}


/* ======================================
   DELETE SPONSOR
====================================== */

async function deleteSponsor(
    id
) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this sponsor?"
        );


    if (!confirmDelete) {

        return;

    }


    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

        return;

    }


    try {


        const response =
            await fetch(
                `${API_URL}/${id}`,
                {

                    method:
                        "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete sponsor."
            );

        }


        loadSponsors();

    }


    catch (error) {

        console.error(
            error
        );


        alert(
            error.message
        );

    }

}

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
