<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Upload Video | Sri Durgamamba Youth</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            padding: 45px 15px;

            color: #f5f1e8;

            background:
                radial-gradient(
                    circle at top,
                    rgba(212,175,55,0.10),
                    transparent 35%
                ),
                #050505;
        }


        /* GOLDEN FRAME */

        body::before {
            content: "";
            position: fixed;
            inset: 14px;
            border: 1px solid rgba(212,175,55,0.45);
            pointer-events: none;
            z-index: 10;
        }


        /* MAIN CONTAINER */

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;

            background:
                linear-gradient(
                    145deg,
                    rgba(25,25,25,0.98),
                    rgba(8,8,8,0.98)
                );

            padding: 38px;

            border-radius: 18px;

            border: 1px solid rgba(212,175,55,0.38);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.7),
                0 0 35px rgba(212,175,55,0.06);

            position: relative;
        }


        /* GOLD TOP LINE */

        .container::before {
            content: "";
            position: absolute;

            top: 0;
            left: 12%;
            right: 12%;

            height: 2px;

            background: linear-gradient(
                90deg,
                transparent,
                #d4af37,
                transparent
            );
        }


        /* HEADING */

        h1 {
            text-align: center;

            font-family: "Playfair Display", serif;

            color: #d4af37;

            font-size: 34px;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            color: #aaa294;

            font-size: 14px;

            margin-bottom: 32px;
        }


        /* LABELS */

        label {
            display: block;

            margin-top: 19px;
            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #f4e4a6;
        }


        /* INPUTS */

        input,
        textarea {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid rgba(212,175,55,0.28);

            border-radius: 9px;

            background: #111;

            color: #f5f1e8;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            transition: 0.25s;
        }


        input::placeholder,
        textarea::placeholder {
            color: #777;
        }


        textarea {
            min-height: 110px;

            resize: vertical;
        }


        input:focus,
        textarea:focus {

            outline: none;

            border-color: #d4af37;

            box-shadow:
                0 0 0 2px rgba(212,175,55,0.08);
        }


        /* FILE BOX */

        .file-box {

            border: 1px dashed rgba(212,175,55,0.65);

            background:
                rgba(212,175,55,0.035);

            padding: 27px 20px;

            text-align: center;

            border-radius: 12px;

            margin-top: 5px;

            transition: 0.25s;
        }


        .file-box:hover {

            border-color: #d4af37;

            background:
                rgba(212,175,55,0.06);
        }


        .file-box input {

            border: none;

            background: transparent;

            padding: 5px;

            color: #ddd;

            cursor: pointer;
        }


        .limit {

            font-size: 12px;

            color: #888;

            margin-top: 10px;
        }


        /* VIDEO PREVIEW */

        .preview {

            margin-top: 22px;

            display: none;

            padding: 10px;

            background: #090909;

            border: 1px solid rgba(212,175,55,0.25);

            border-radius: 12px;
        }


        video {

            width: 100%;

            max-height: 340px;

            display: block;

            border-radius: 8px;

            background: #000;
        }


        /* UPLOAD BUTTON */

        .upload-btn {

            width: 100%;

            margin-top: 27px;

            padding: 15px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #f0d77a
                );

            color: #111;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 7px 20px rgba(212,175,55,0.15);
        }


        .upload-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 28px rgba(212,175,55,0.25);
        }


        .upload-btn:disabled {

            background: #555;

            color: #aaa;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* PROGRESS */

        .progress-container {

            display: none;

            margin-top: 22px;
        }


        .progress-bar {

            width: 100%;

            height: 10px;

            background: #222;

            border-radius: 10px;

            overflow: hidden;

            border: 1px solid rgba(212,175,55,0.15);
        }


        .progress {

            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #b8941f,
                    #f0d77a
                );

            transition: width 0.2s;
        }


        .progress-text {

            text-align: center;

            margin-top: 9px;

            color: #aaa294;

            font-size: 13px;
        }


        /* STATUS */

        #status {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

            font-weight: 600;
        }


        /* BACK BUTTON */

        .back-btn {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #d4af37;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;
        }


        .back-btn:hover {

            color: #f4e4a6;

        }


        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 30px 12px;
            }

            body::before {
                inset: 8px;
            }

            .container {
                padding: 27px 20px;
                border-radius: 14px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 13px;
            }

            .file-box {
                padding: 22px 12px;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>Upload Festival Video</h1>

    <p class="subtitle">
        Add a video to the festival archive
    </p>


    <form id="videoForm">


        <label for="festivalYear">
            Festival Year
        </label>

        <input
            type="number"
            id="festivalYear"
            name="festivalYear"
            placeholder="Example: 2026"
            required
        >


        <label for="title">
            Video Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            placeholder="Example: Ganesh Chaturthi Celebration"
            required
        >


        <label for="video">
            Select Video
        </label>


        <div class="file-box">

            <input
                type="file"
                id="video"
                name="video"
                accept="video/*"
                required
            >

            <p class="limit">
                Maximum file size: 100 MB
            </p>

        </div>


        <div
            class="preview"
            id="preview">

            <video
                id="videoPreview"
                controls>
            </video>

        </div>


        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            name="description"
            placeholder="Optional description"></textarea>


        <button
            type="submit"
            class="upload-btn"
            id="uploadBtn">

            Upload Video

        </button>


        <div
            class="progress-container"
            id="progressContainer">

            <div class="progress-bar">

                <div
                    class="progress"
                    id="progress">
                </div>

            </div>

            <p
                class="progress-text"
                id="progressText">

                0%

            </p>

        </div>


        <p id="status"></p>


    </form>


    <a
        href="admin.html"
        class="back-btn">

        ← Back to Admin Dashboard

    </a>

</div>



<script>


const form =
    document.getElementById("videoForm");

const videoInput =
    document.getElementById("video");

const preview =
    document.getElementById("preview");

const videoPreview =
    document.getElementById("videoPreview");

const uploadBtn =
    document.getElementById("uploadBtn");

const status =
    document.getElementById("status");

const progressContainer =
    document.getElementById("progressContainer");

const progress =
    document.getElementById("progress");

const progressText =
    document.getElementById("progressText");



// ======================================================
// VIDEO PREVIEW
// ======================================================

videoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {

        preview.style.display = "none";

        return;
    }


    // Maximum 100 MB

    const maxSize =
        100 * 1024 * 1024;


    if (file.size > maxSize) {

        alert(
            "Video is larger than 100 MB. Please select a smaller video."
        );

        this.value = "";

        preview.style.display = "none";

        return;
    }


    const videoURL =
        URL.createObjectURL(file);

    videoPreview.src =
        videoURL;

    preview.style.display =
        "block";

});



// ======================================================
// UPLOAD VIDEO
// ======================================================

form.addEventListener(
    "submit",
    function (e) {

        e.preventDefault();


        const token =
            localStorage.getItem("token");


        if (!token) {

            alert(
                "Please login before uploading a video."
            );

            window.location.href =
                "login.html";

            return;
        }


        const file =
            videoInput.files[0];


        if (!file) {

            alert(
                "Please select a video."
            );

            return;
        }


        const festivalYear =
            document.getElementById(
                "festivalYear"
            ).value;


        const title =
            document.getElementById(
                "title"
            ).value;


        const description =
            document.getElementById(
                "description"
            ).value;


        const formData =
            new FormData();


        formData.append(
            "festivalYear",
            festivalYear
        );


        formData.append(
            "title",
            title
        );


        formData.append(
            "description",
            description
        );


        formData.append(
            "video",
            file
        );


        uploadBtn.disabled =
            true;

        uploadBtn.textContent =
            "Uploading...";


        progressContainer.style.display =
            "block";


        status.textContent =
            "Uploading video...";

        status.style.color =
            "#aaa294";


        const xhr =
            new XMLHttpRequest();


        xhr.open(
            "POST",
            "http://localhost:5000/api/videos",
            true
        );


        xhr.setRequestHeader(
            "Authorization",
            "Bearer " + token
        );


        // ==================================================
        // UPLOAD PROGRESS
        // ==================================================

        xhr.upload.addEventListener(
            "progress",
            function (event) {

                if (event.lengthComputable) {

                    const percent =
                        Math.round(
                            (event.loaded /
                                event.total) *
                            100
                        );


                    progress.style.width =
                        percent + "%";


                    progressText.textContent =
                        percent + "%";

                }

            }
        );


        // ==================================================
        // UPLOAD COMPLETED
        // ==================================================

        xhr.onload = function () {

            uploadBtn.disabled =
                false;

            uploadBtn.textContent =
                "Upload Video";


            if (
                xhr.status >= 200 &&
                xhr.status < 300
            ) {

                status.textContent =
                    "Video uploaded successfully!";

                status.style.color =
                    "#d4af37";


                form.reset();


                preview.style.display =
                    "none";


                progress.style.width =
                    "100%";


                progressText.textContent =
                    "100%";


                setTimeout(
                    function () {

                        window.location.href =
                            "admin.html";

                    },
                    1500
                );

            }

            else {

                let message =
                    "Video upload failed.";


                try {

                    const response =
                        JSON.parse(
                            xhr.responseText
                        );


                    if (response.message) {

                        message =
                            response.message;

                    }

                }

                catch (error) {

                    console.log(error);

                }


                status.textContent =
                    message;

                status.style.color =
                    "#e57373";

            }

        };


        // ==================================================
        // NETWORK ERROR
        // ==================================================

        xhr.onerror = function () {

            uploadBtn.disabled =
                false;

            uploadBtn.textContent =
                "Upload Video";


            status.textContent =
                "Unable to connect to server.";

            status.style.color =
                "#e57373";

        };


        xhr.send(formData);

    }
);


</script>


</body>

</html>
