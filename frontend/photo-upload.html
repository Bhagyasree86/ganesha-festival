<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Sri Durgamamba Youth | Upload Photos
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #fff1e6,
                    #ffd6d6
                );

            padding: 30px 20px;

        }


        .container {

            max-width: 650px;

            margin: auto;

        }


        /* =========================
           HEADER
        ========================= */

        .header {

            text-align: center;

            margin-bottom: 25px;

        }


        .ganesha {

            font-size: 55px;

            margin-bottom: 10px;

        }


        h1 {

            color: #b85c6b;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #666;

        }


        /* =========================
           UPLOAD BOX
        ========================= */

        .upload-box {

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);

        }


        /* =========================
           LABELS
        ========================= */

        label {

            display: block;

            margin-bottom: 8px;

            color: #555;

            font-weight: bold;

        }


        /* =========================
           INPUTS
        ========================= */

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

        }


        input:focus {

            outline: none;

            border-color: #e88a9a;

            box-shadow:
                0 0 0 2px
                rgba(232, 138, 154, 0.15);

        }


        input[type="file"] {

            background: #fff8f8;

            cursor: pointer;

        }


        /* =========================
           BUTTON
        ========================= */

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #e88a9a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        button:hover {

            background: #b85c6b;

        }


        button:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {

            margin-top: 12px;

            background: #777;

        }


        .back-btn:hover {

            background: #555;

        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            text-align: center;

            margin-top: 18px;

            font-weight: bold;

            line-height: 1.5;

        }


        /* =========================
           PREVIEW
        ========================= */

        .preview {

            margin-top: 25px;

            text-align: center;

            display: none;

        }


        .preview h3 {

            color: #b85c6b;

            margin-bottom: 10px;

        }


        .preview img {

            max-width: 100%;

            max-height: 300px;

            border-radius: 12px;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.15);

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 12px;

            }


            .upload-box {

                padding: 25px 20px;

            }


            h1 {

                font-size: 25px;

            }


            .ganesha {

                font-size: 45px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <div class="ganesha">
                🙏
            </div>


            <h1>
                Sri Durgamamba Youth
            </h1>


            <p class="subtitle">
                Ganesha Festival Photo Upload
            </p>

        </div>



        <!-- =========================
             UPLOAD BOX
        ========================= -->

        <div class="upload-box">


            <form id="photoForm">


                <!-- Festival Year -->

                <label for="festivalYear">
                    Festival Year
                </label>


                <input
                    type="number"
                    id="festivalYear"
                    placeholder="Example: 2026"
                    min="2000"
                    max="2100"
                    required
                >



                <!-- Festival Event -->

                <label for="event">
                    Festival Event
                </label>


                <input
                    type="text"
                    id="event"
                    placeholder="Example: Ganesh Chaturthi"
                    required
                >



                <!-- Photo Title -->

                <label for="title">
                    Photo Title
                </label>


                <input
                    type="text"
                    id="title"
                    placeholder="Example: Ganesha Idol"
                    required
                >



                <!-- Select Photo -->

                <label for="photo">
                    Select Photo
                </label>


                <input
                    type="file"
                    id="photo"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                    required
                >



                <!-- Upload Button -->

                <button
                    type="submit"
                    id="uploadButton">

                    Upload Photo

                </button>


            </form>



            <!-- Message -->

            <p id="message"></p>



            <!-- Preview -->

            <div
                class="preview"
                id="preview">


                <h3>
                    Selected Photo
                </h3>


                <img
                    id="previewImage"
                    src=""
                    alt="Selected Photo Preview">


            </div>



            <!-- Back -->

            <button
                class="back-btn"
                type="button"
                onclick="window.location.href='admin.html'">

                ← Back to Admin Dashboard

            </button>


        </div>


    </div>



    <script>


        // ==========================================
        // CHECK LOGIN
        // ==========================================

        const token =
            localStorage.getItem("token");


        if (!token) {

            window.location.href =
                "login.html";

        }



        // ==========================================
        // GET ELEMENTS
        // ==========================================

        const photoInput =
            document.getElementById("photo");


        const preview =
            document.getElementById("preview");


        const previewImage =
            document.getElementById("previewImage");


        const form =
            document.getElementById("photoForm");


        const message =
            document.getElementById("message");


        const uploadButton =
            document.getElementById("uploadButton");



        // ==========================================
        // PHOTO PREVIEW
        // ==========================================

        photoInput.addEventListener(
            "change",
            function () {


                const file =
                    this.files[0];


                if (!file) {

                    preview.style.display =
                        "none";

                    previewImage.src = "";

                    return;

                }



                // Check file type

                if (!file.type.startsWith("image/")) {

                    message.textContent =
                        "Please select a valid image file.";

                    message.style.color =
                        "red";

                    this.value = "";

                    preview.style.display =
                        "none";

                    return;

                }



                // Create preview

                const imageURL =
                    URL.createObjectURL(file);


                previewImage.src =
                    imageURL;


                preview.style.display =
                    "block";


                message.textContent = "";

            }
        );



        // ==========================================
        // UPLOAD PHOTO
        // ==========================================

        form.addEventListener(
            "submit",
            async function (event) {


                event.preventDefault();



                // --------------------------------------
                // Get values
                // --------------------------------------

                const festivalYear =
                    document
                        .getElementById("festivalYear")
                        .value
                        .trim();


                const festivalEvent =
                    document
                        .getElementById("event")
                        .value
                        .trim();


                const title =
                    document
                        .getElementById("title")
                        .value
                        .trim();


                const photo =
                    photoInput.files[0];



                // --------------------------------------
                // Validation
                // --------------------------------------

                if (!festivalYear) {

                    message.textContent =
                        "Please enter festival year.";

                    message.style.color =
                        "red";

                    return;

                }



                if (!festivalEvent) {

                    message.textContent =
                        "Please enter festival event.";

                    message.style.color =
                        "red";

                    return;

                }



                if (!title) {

                    message.textContent =
                        "Please enter photo title.";

                    message.style.color =
                        "red";

                    return;

                }



                if (!photo) {

                    message.textContent =
                        "Please select a photo.";

                    message.style.color =
                        "red";

                    return;

                }



                // --------------------------------------
                // Check image
                // --------------------------------------

                if (!photo.type.startsWith("image/")) {

                    message.textContent =
                        "Only image files are allowed.";

                    message.style.color =
                        "red";

                    return;

                }



                // --------------------------------------
                // Create FormData
                // --------------------------------------

                const formData =
                    new FormData();


                formData.append(
                    "festivalYear",
                    festivalYear
                );


                formData.append(
                    "event",
                    festivalEvent
                );


                formData.append(
                    "title",
                    title
                );


                formData.append(
                    "photo",
                    photo
                );



                // --------------------------------------
                // Upload status
                // --------------------------------------

                message.textContent =
                    "Uploading photo... Please wait.";

                message.style.color =
                    "#b85c6b";


                uploadButton.disabled =
                    true;


                uploadButton.textContent =
                    "Uploading...";



                // ======================================
                // SEND REQUEST
                // ======================================

                try {


                    const response =
                        await fetch(
                            "https://gnesha-festival-backend.onrender.com/api/photos",
                            {
                                method: "POST",

                                headers: {

                                    "Authorization":
                                        "Bearer " + token

                                },

                                body: formData

                            }
                        );



                    // ----------------------------------
                    // Read response
                    // ----------------------------------

                    const text =
                        await response.text();


                    console.log(
                        "Server response:",
                        text
                    );


                    let data;


                    try {

                        data =
                            JSON.parse(text);

                    }

                    catch {

                        data = {
                            message: text
                        };

                    }



                    console.log(
                        "Upload response:",
                        data
                    );



                    // ==================================
                    // SUCCESS
                    // ==================================

                    if (response.ok) {


                        message.textContent =
                            "Photo uploaded successfully!";

                        message.style.color =
                            "green";



                        // Show Cloudinary URL

                        if (
                            data.photo &&
                            data.photo.imageUrl
                        ) {

                            console.log(
                                "Cloudinary Image URL:",
                                data.photo.imageUrl
                            );

                        }



                        // Reset form

                        form.reset();


                        preview.style.display =
                            "none";


                        previewImage.src = "";

                    }



                    // ==================================
                    // ERROR
                    // ==================================

                    else {


                        console.error(
                            "Photo upload failed:",
                            data
                        );


                        message.textContent =
                            data.message ||
                            "Photo upload failed.";


                        message.style.color =
                            "red";

                    }


                }


                // ======================================
                // CONNECTION ERROR
                // ======================================

                catch (error) {


                    console.error(
                        "Connection error:",
                        error
                    );


                    message.textContent =
                        "Unable to connect to server.";

                    message.style.color =
                        "red";

                }


                // ======================================
                // ENABLE BUTTON AGAIN
                // ======================================

                finally {


                    uploadButton.disabled =
                        false;


                    uploadButton.textContent =
                        "Upload Photo";

                }

            }
        );

    </script>


</body>

</html>
